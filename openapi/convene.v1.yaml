        "201":
          $ref: "#/components/responses/Created"

  /admin/config/matching-weights:
    get:
      tags: [admin]
      summary: View matching weight config (row 65)
      x-auth: admin
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    put:
      tags: [admin]
      summary: Update matching weights — must sum to 1.00 (row 65)
      x-auth: admin
      requestBody:
        content:
          application/json:
            schema:
