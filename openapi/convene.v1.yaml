openapi: 3.1.0
info:
  title: Convene API
  version: "1.0"
  description: >
    PRD §17.9 — the routing index and contract for anything not already
    covered in §10. Full request/response schemas, validation rules and
    per-endpoint error tables are specified inline in §10; this document is
    authored now with all 67 endpoint rows declared so client and server
    types can be generated from a single source of truth (P4.4) and cannot
    drift, with concrete request/response schemas filled in as each phase
    implements that module. Until then, request/response bodies use the
    Placeholder schema (an open object) rather than inventing shapes ahead
    of the phases that own them.
servers:
  - url: https://api.convene.app/v1

security:
  - bearerAuth: []

tags:
  - name: auth
    description: §10.1 Identity, Authentication & Onboarding
  - name: profile
    description: §10.2 Professional Profile
  - name: availability
    description: §10.3 Availability System
  - name: intents
    description: §10.4 Intent-Based Networking
  - name: location
    description: §10.5 Location-Based Networking
  - name: discovery
    description: §11 Matching & discovery
  - name: connections
    description: §10.6 Connections
  - name: messaging
    description: §10.7 Messaging
  - name: notifications
    description: §10.8 Notifications
  - name: search
    description: §10.9 Search & Discovery Surfaces
  - name: trust-safety
    description: §10.10 Trust, Safety & Reputation
  - name: media
    description: §17.7 Media Pipeline
  - name: ai
    description: §12 AI features
  - name: billing
    description: §7 Billing
  - name: account
    description: §20.6 GDPR data export / account lifecycle
  - name: realtime
    description: §17.5 Realtime gateway
  - name: reference-data
    description: §16 Taxonomies
  - name: admin
    description: §14.20 / §20.8 Admin & moderation
  - name: ops
    description: §21 Probes, Prometheus

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh-token cookie, httpOnly/Secure/SameSite=Strict (§10.1).
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: Provider webhook signature verification (§7) — not a user credential.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor (§17.9 conventions).
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Supported on every POST that creates a resource (§17.9 conventions).
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag-based optimistic concurrency on profile updates (§17.9 conventions).
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Placeholder:
      description: >
        Concrete request/response schemas are filled in as each phase
        implements the owning module (§10 has the authoritative shapes) —
        this is deliberately open rather than an invented shape.
      type: object
      additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, field, details, request_id, retry_after]
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: [string, "null"]
            details:
              nullable: true
            request_id:
              type: string
              format: uuid
            retry_after:
              type: [integer, "null"]
    PaginationMeta:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
    PaginatedPlaceholder:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Placeholder"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Placeholder"
    OkList:
      description: OK (paginated)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaginatedPlaceholder"
    Created:
      description: Created
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Placeholder"
    Accepted:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Placeholder"
    NoContent:
      description: No Content
    BadRequest:
      description: Malformed request (§17.9)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing/expired access token (§17.9)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated but not permitted (§17.9)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Not found or not visible to you (§17.9)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflict — ETag, duplicate, or state (§17.9)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Gone:
      description: Expired resource (§17.9)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Validation failure (§17.9)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Rate limited / quota exhausted (§17.9)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected error (§17.9)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

paths:
  # ── §10.1 Identity, Authentication & Onboarding (rows 1-11) ──────────
  /auth/register:
    post:
      tags: [auth]
      summary: Create account (row 1)
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [auth]
      summary: Password login (row 2)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate tokens (row 3)
      security:
        - cookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session (row 4)
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke all sessions (row 5)
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /auth/otp/send:
    post:
      tags: [auth]
      summary: Phone verification — send OTP (row 6)
      x-auth: mixed
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Phone verification — verify OTP (row 6)
      x-auth: mixed
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/email/verify:
    post:
      tags: [auth]
      summary: Email verification (row 7)
      x-auth: mixed
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "410":
          $ref: "#/components/responses/Gone"

  /auth/email/resend:
    post:
      tags: [auth]
      summary: Resend email verification (row 7)
      x-auth: mixed
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Password lifecycle — forgot (row 8)
      x-auth: mixed
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"

  /auth/password/reset:
    post:
      tags: [auth]
      summary: Password lifecycle — reset (row 8)
      x-auth: mixed
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"

  /auth/password/change:
    post:
      tags: [auth]
      summary: Password lifecycle — change while authenticated (row 8)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /auth/sessions:
    get:
      tags: [auth]
      summary: Device list (row 9)
      responses:
        "200":
          $ref: "#/components/responses/OkList"

  /auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Remote session revoke (row 9)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/oauth/{provider}/callback:
    post:
      tags: [auth]
      summary: OAuth exchange (row 10)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, linkedin, apple]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/account/delete:
    post:
      tags: [account]
      summary: 30-day deletion (row 11)
      responses:
        "202":
          $ref: "#/components/responses/Accepted"

  /auth/account/cancel-delete:
    post:
      tags: [account]
      summary: Cancel pending deletion (row 11)
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  # ── §10.2 Professional Profile (rows 12-17) ──────────────────────────
  /me:
    get:
      tags: [profile]
      summary: Own account (row 12)
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [profile]
      summary: Update own account (row 12)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /me/profile:
    get:
      tags: [profile]
      summary: Own profile (row 13)
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [profile]
      summary: Own profile partial update (ETag, row 13)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /profiles/{id}:
    get:
      tags: [profile]
      summary: View profile, visibility-filtered (row 14)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/skills:
    get:
      tags: [profile]
      summary: List own skills (row 15)
      responses:
        "200":
          $ref: "#/components/responses/OkList"
    post:
      tags: [profile]
      summary: Add a skill (row 15)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /me/skills/{id}:
    patch:
      tags: [profile]
      summary: Update a skill (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [profile]
      summary: Remove a skill (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/experiences:
    get:
      tags: [profile]
      summary: List experience entries (row 15)
      responses:
        "200":
          $ref: "#/components/responses/OkList"
    post:
      tags: [profile]
      summary: Add an experience entry (row 15)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /me/experiences/{id}:
    patch:
      tags: [profile]
      summary: Update an experience entry (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [profile]
      summary: Remove an experience entry (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/education:
    get:
      tags: [profile]
      summary: List education entries (row 15)
      responses:
        "200":
          $ref: "#/components/responses/OkList"
    post:
      tags: [profile]
      summary: Add an education entry (row 15)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
  /me/education/{id}:
    patch:
      tags: [profile]
      summary: Update an education entry (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [profile]
      summary: Remove an education entry (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/certifications:
    get:
      tags: [profile]
      summary: List certifications (row 15)
      responses:
        "200":
          $ref: "#/components/responses/OkList"
    post:
      tags: [profile]
      summary: Add a certification (row 15)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
  /me/certifications/{id}:
    patch:
      tags: [profile]
      summary: Update a certification (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [profile]
      summary: Remove a certification (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/portfolio:
    get:
      tags: [profile]
      summary: List portfolio items (row 15)
      responses:
        "200":
          $ref: "#/components/responses/OkList"
    post:
      tags: [profile]
      summary: Add a portfolio item (row 15)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /me/portfolio/{id}:
    patch:
      tags: [profile]
      summary: Update a portfolio item (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [profile]
      summary: Remove a portfolio item (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/interests:
    get:
      tags: [profile]
      summary: List interests (row 15)
      responses:
        "200":
          $ref: "#/components/responses/OkList"
    post:
      tags: [profile]
      summary: Add an interest (row 15)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
  /me/interests/{id}:
    delete:
      tags: [profile]
      summary: Remove an interest (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/languages:
    get:
      tags: [profile]
      summary: List languages (row 15)
      responses:
        "200":
          $ref: "#/components/responses/OkList"
    post:
      tags: [profile]
      summary: Add a language (row 15)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
  /me/languages/{id}:
    patch:
      tags: [profile]
      summary: Update a language (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [profile]
      summary: Remove a language (row 15)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"

  /me/verification/{level}:
    post:
      tags: [profile]
      summary: Advance verification ladder (row 16)
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: string
            enum: [L1, L2, L3, L4]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /me/profile/completion:
    get:
      tags: [profile]
      summary: Completion breakdown (row 17)
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  # ── §10.3 Availability System (rows 18-22) ───────────────────────────
  /availability/sessions:
    post:
      tags: [availability]
      summary: Go available — returns match_preview (row 18)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /availability/sessions/{id}/extend:
    post:
      tags: [availability]
      summary: Extend session (row 19)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "409":
          $ref: "#/components/responses/Conflict"

  /availability/sessions/{id}/end:
    post:
      tags: [availability]
      summary: End session early (row 19)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /availability/me:
    get:
      tags: [availability]
      summary: Current availability state (row 20)
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /availability/history:
    get:
      tags: [availability]
      summary: Availability history (row 20)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/OkList"

  /availability/state:
    put:
      tags: [availability]
      summary: Set Busy / Away / Invisible (row 21)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /availability/schedules:
    get:
      tags: [availability]
      summary: List recurring windows (row 22)
      responses:
        "200":
          $ref: "#/components/responses/OkList"
    post:
      tags: [availability]
      summary: Create a recurring window (row 22)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
