        "200":
          $ref: "#/components/responses/Ok"
    post:
      tags: [account]
      summary: Request a GDPR data export (row 60)
      responses:
        "202":
          $ref: "#/components/responses/Accepted"

  # ── §17.5 Realtime gateway (row 61) ──────────────────────────────────────
  /realtime/ticket:
    post:
      tags: [realtime]
      summary: Short-lived WebSocket connection ticket (row 61)
      responses:
        "201":
          $ref: "#/components/responses/Created"

  # ── §16 Reference data (row 62) ────────────────────────────────────────
  /taxonomies/{taxonomy}:
    get:
      tags: [reference-data]
      summary: Reference data, cached (row 62)
      security: []
      parameters:
        - name: taxonomy
          in: path
          required: true
          schema:
            type: string
            enum: [skills, industries, cities, languages, interests]
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/OkList"

