      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/OkList"
  /admin/reports/{id}:
    patch:
      tags: [admin]
      summary: Update a report's disposition (row 63)
      x-auth: mod
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placeholder"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /admin/moderation-actions:
    post:
      tags: [admin]
